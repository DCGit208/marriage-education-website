<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTN Mobile Money Payment - Marriage Education</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #FFCB05 0%, #FFA000 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .momo-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }

    .momo-logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .momo-logo h1 {
      color: #FFCB05;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .momo-logo p {
      color: #666;
      font-size: 0.9rem;
    }

    .order-summary {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    .order-summary h3 {
      color: #333;
      margin-bottom: 15px;
      font-size: 1.1rem;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      padding: 10px 0;
      border-bottom: 1px solid #dee2e6;
      color: #333;
    }

    .order-total {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px solid #FFCB05;
      font-size: 1.3rem;
      font-weight: bold;
      color: #111;
    }

    .payment-form {
      margin-top: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #FFCB05;
    }

    .phone-hint {
      font-size: 0.85rem;
      color: #666;
      margin-top: 5px;
    }

    .pay-button {
      width: 100%;
      background: linear-gradient(135deg, #FFCB05 0%, #FFA000 100%);
      color: #000;
      border: none;
      padding: 18px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    .pay-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 203, 5, 0.4);
    }

    .pay-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .loading-spinner {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #FFCB05;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .status-message {
      display: none;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      text-align: center;
    }

    .status-message.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }

    .status-message.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }

    .status-message.pending {
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      color: #856404;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #666;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      color: #FFCB05;
    }

    .security-note {
      text-align: center;
      color: #999;
      font-size: 0.8rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="momo-container">
    <div class="momo-logo">
      <h1>📱 MTN Mobile Money</h1>
      <p>Secure payment powered by MTN MOMO</p>
    </div>

    <div class="order-summary">
      <h3>Order Summary</h3>
      <div class="order-item">
        <span id="product-name">Loading...</span>
        <span id="product-price">-</span>
      </div>
      <div class="order-total">
        <span>Total</span>
        <span id="order-total">-</span>
      </div>
    </div>

    <div id="payment-form-container">
      <form class="payment-form" id="momo-payment-form">
        <div class="form-group">
          <label for="phone-number">
            MTN Mobile Money Number
          </label>
          <input 
            type="tel" 
            id="phone-number" 
            name="phone-number" 
            placeholder="237XXXXXXXXX" 
            required
            pattern="[0-9]{9,12}"
          >
          <p class="phone-hint">Enter your MTN MOMO number (9 digits) or with country code 237XXXXXXXXX</p>
        </div>

        <button type="submit" class="pay-button" id="pay-btn">
          Pay with MTN MOMO
        </button>
      </form>
    </div>

    <div class="loading-spinner" id="loading-spinner">
      <div class="spinner"></div>
      <p id="loading-text">Processing your payment...</p>
    </div>

    <div class="status-message" id="status-message"></div>

    <a href="javascript:history.back()" class="back-link">← Back to payment options</a>

    <div class="security-note">
      🔒 Secure payment | Your transaction is encrypted
    </div>
  </div>

  <script src="momo-checkout.js"></script>
</body>
</html>
