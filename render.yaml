services:
  - type: web
    name: marriage-education-stripe
    runtime: ruby
    buildCommand: "bundle install"
    startCommand: "bundle exec ruby stripe/server.rb"
    envVars:
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: YOUR_DOMAIN
        value: https://marriageducation.com
    autoDeploy: true
