services:
  - type: web
    name: marriage-education-payments
    runtime: ruby
    plan: free
    buildCommand: "bundle install"
    startCommand: "bundle exec ruby server.rb"
    envVars:
      # Stripe Configuration
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # MTN MOMO Configuration
      - key: MTN_MOMO_PRIMARY_KEY
        sync: false
      - key: MTN_MOMO_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_MOMO_API_USER
        sync: false
      - key: MTN_MOMO_API_KEY
        sync: false
      - key: MTN_MOMO_ENVIRONMENT
        value: sandbox
      - key: MTN_MOMO_BASE_URL
        value: https://sandbox.momodeveloper.mtn.com
      # Domain Configuration
      - key: YOUR_DOMAIN
        value: https://marriageducation.com
    autoDeploy: true
