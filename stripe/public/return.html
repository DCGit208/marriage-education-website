<!DOCTYPE html>
<html>
<head>
  <title>Thanks for your order!</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="style.css">
  <script>
    // SIMPLE: Show download link immediately for MOMO payments
    const urlParams = new URLSearchParams(window.location.search);
    const paymentMethod = urlParams.get('payment_method');
    const productId = urlParams.get('product_id');
    
    // If it's a MOMO payment, show everything NOW
    if (paymentMethod === 'momo' && productId) {
      document.write('<style>#success { display: block !important; } #download-link-container { display: block !important; }</style>');
    }
  </script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
  <script src="commission-processor.js"></script>
  <script src="return.js?v=4" defer></script>
</head>
<body style="background: #f6f9fc; margin:0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Ubuntu', sans-serif;">
  <div class="return-container">
    <section id="success" class="hidden">
      <div class="success-icon">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="32" fill="#635bff"/>
          <path d="M19 33.5L28.5 43L45 27" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="success-title">Thank you for your purchase!</h1>
      <p class="success-message">
        <span class="support-message">If you have any questions, please email <a href="mailto:orders@marriageducation.com">orders@marriageducation.com</a>.</span>
      </p>
      <div id="download-link-container" style="margin-top:24px; margin-bottom:18px; display:none;">
        <script>
          // Set download link directly from URL
          const pid = new URLSearchParams(window.location.search).get('product_id');
          if (pid) {
            document.write('<a href="/download?product_id=' + encodeURIComponent(pid) + '" class="download-ebook" style="display:inline-block; padding:12px 32px; background:#00b894; color:#fff; border-radius:8px; text-decoration:none; font-weight:600; font-size:1.1rem; box-shadow: 0 2px 8px rgba(0,184,148,0.3);">📥 Download your eBook Now</a>');
          }
        </script>
      </div>
      <a href="https://marriageducation.com" class="return-home" style="margin-top:12px; display:inline-block; padding:10px 24px; background:#635bff; color:#fff; border-radius:8px; text-decoration:none; font-weight:500;">Return to Home</a>
    </section>
  </div>
  <style>
    .hidden {
      display: none !important;
    }
    .return-container {
      max-width: 420px;
      margin: 60px auto 0 auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(50, 50, 93, 0.08), 0 1.5px 4px rgba(0,0,0,0.03);
      padding: 40px 24px 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .success-icon {
      margin-bottom: 18px;
    }
    .success-title {
      color: #635bff;
      font-size: 2rem;
      font-weight: 700;
      margin: 0 0 12px 0;
      letter-spacing: -1px;
    }
    .success-message {
      color: #32325d;
      font-size: 1.1rem;
      margin-bottom: 18px;
    }
    .email-highlight {
      color: #635bff;
      font-weight: 600;
    }
    .support-message {
      display: block;
      margin-top: 8px;
      color: #6b7c93;
      font-size: 0.98rem;
    }
    .return-home {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 24px;
      background: #635bff;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .return-home:hover {
      background: #4b3be7;
    }
    @media (max-width: 600px) {
      .return-container {
        max-width: 98vw;
        padding: 16px 2vw 16px 2vw;
      }
      .success-title {
        font-size: 1.3rem;
      }
    }
  </style>
</body>
</html>
