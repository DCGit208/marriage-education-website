name: Deploy SBD Network to Firebase

on:
  push:
    branches: [main]
    paths:
      - 'sbd-network/**'
      - '.github/workflows/sbd-network-deploy.yml'
  workflow_dispatch:

concurrency:
  group: sbd-network-firebase-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: sbd-network

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require FIREBASE_SERVICE_ACCOUNT
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add repository secret FIREBASE_SERVICE_ACCOUNT (service account JSON)"
            exit 1
          fi
        working-directory: .

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            functions:
              - 'sbd-network/functions/**'
              - '.github/workflows/sbd-network-deploy.yml'
            rules:
              - 'sbd-network/firestore.rules'
              - 'sbd-network/firestore.indexes.json'
              - 'sbd-network/storage.rules'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install site dependencies
        run: npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build (HTML stamp + version.json)
        run: npm run build

      - name: Install functions dependencies
        if: steps.filter.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install
        working-directory: sbd-network/functions

      - name: Deploy to Firebase
        run: |
          ONLY="hosting"
          if [ "${{ steps.filter.outputs.rules }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # storage omitted: the deploy SA lacks serviceusage permission for
            # firebasestorage.googleapis.com; hosting + Firestore are enough
            # for site restores. Deploy storage.rules manually when needed.
            ONLY="${ONLY},firestore:rules,firestore:indexes"
          fi
          if [ "${{ steps.filter.outputs.functions }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ONLY="${ONLY},functions"
          fi
          echo "Deploying: --only ${ONLY}"
          firebase deploy --only "${ONLY}" --project marriage-education --non-interactive --force
