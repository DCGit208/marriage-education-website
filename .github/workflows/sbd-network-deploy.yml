name: Deploy SBD Network to Firebase

on:
  push:
    branches: [main]
    paths:
      - 'sbd-network/**'
      - '.github/workflows/sbd-network-deploy.yml'
  workflow_dispatch:

concurrency:
  group: sbd-network-firebase-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: sbd-network

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require FIREBASE_TOKEN
        if: ${{ env.FIREBASE_TOKEN == '' }}
        run: |
          echo "::error::Add repository secret FIREBASE_TOKEN (run: firebase login:ci)"
          exit 1
        working-directory: .

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            functions:
              - 'sbd-network/functions/**'
            rules:
              - 'sbd-network/firestore.rules'
              - 'sbd-network/firestore.indexes.json'
              - 'sbd-network/storage.rules'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install site dependencies
        run: npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build (HTML stamp + version.json)
        run: npm run build

      - name: Install functions dependencies
        if: steps.filter.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci
        working-directory: sbd-network/functions

      - name: Deploy to Firebase
        run: |
          ONLY="hosting"
          if [ "${{ steps.filter.outputs.rules }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ONLY="${ONLY},firestore:rules,firestore:indexes,storage"
          fi
          if [ "${{ steps.filter.outputs.functions }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ONLY="${ONLY},functions"
          fi
          echo "Deploying: --only ${ONLY}"
          firebase deploy --only "${ONLY}" --project marriage-education --non-interactive
