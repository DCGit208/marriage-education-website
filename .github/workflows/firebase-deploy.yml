name: Deploy Marriage Education to Firebase

# Firebase Hosting targets: main + marriageducation (web.app)
# Root Cloud Functions live in /functions
# FTP deploy for marriageducation.com remains separate (deploy-to-ftp.yml)

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/copy-canon-bundle.js'
      - '.github/workflows/firebase-deploy.yml'
    paths-ignore:
      - 'sbd-network/**'
  workflow_dispatch:

concurrency:
  group: marriage-education-firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy hosting & backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require FIREBASE_TOKEN
        if: ${{ env.FIREBASE_TOKEN == '' }}
        run: |
          echo "::error::Add repository secret FIREBASE_TOKEN (run: firebase login:ci)"
          exit 1

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            hosting:
              - 'public/**'
              - 'firebase.json'
              - '.firebaserc'
            functions:
              - 'functions/**'
              - 'scripts/copy-canon-bundle.js'
            rules:
              - 'firestore.rules'
              - 'storage.rules'
              - 'sbd-network/firestore.rules'
              - 'sbd-network/firestore.indexes.json'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        if: steps.filter.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci
        working-directory: functions

      - name: Deploy to Firebase
        run: |
          PARTS=()
          if [ "${{ steps.filter.outputs.hosting }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PARTS+=("hosting")
          fi
          if [ "${{ steps.filter.outputs.functions }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PARTS+=("functions")
          fi
          if [ "${{ steps.filter.outputs.rules }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PARTS+=("firestore:rules" "firestore:indexes" "storage")
          fi
          if [ ${#PARTS[@]} -eq 0 ]; then
            PARTS=("hosting")
          fi
          ONLY=$(IFS=,; echo "${PARTS[*]}")
          echo "Deploying: --only ${ONLY}"
          firebase deploy --only "${ONLY}" --project marriage-education --non-interactive
