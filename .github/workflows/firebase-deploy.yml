name: Deploy Marriage Education to Firebase

# Firebase Hosting targets: main + marriageducation + sbd-network
# Root Cloud Functions live in /functions
# FTP deploy for marriageducation.com remains separate (deploy-to-ftp.yml)

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/copy-canon-bundle.js'
      - 'sbd-network/public/**'
      - 'sbd-network/firebase.json'
      - 'sbd-network/firestore.rules'
      - 'sbd-network/firestore.indexes.json'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: marriage-education-firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy hosting & backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require FIREBASE_SERVICE_ACCOUNT
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add repository secret FIREBASE_SERVICE_ACCOUNT (service account JSON)"
            exit 1
          fi

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            hosting:
              - 'public/**'
              - 'firebase.json'
              - '.firebaserc'
            sbdHosting:
              - 'sbd-network/public/**'
              - 'sbd-network/firebase.json'
              - '.firebaserc'
            functions:
              - 'functions/**'
              - 'scripts/copy-canon-bundle.js'
            rules:
              - 'firestore.rules'
              - 'storage.rules'
              - 'sbd-network/firestore.rules'
              - 'sbd-network/firestore.indexes.json'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        if: steps.filter.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install --no-audit --no-fund
        working-directory: functions

      - name: Deploy root Firebase resources
        if: steps.filter.outputs.hosting == 'true' || steps.filter.outputs.functions == 'true' || steps.filter.outputs.rules == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          PARTS=()
          if [ "${{ steps.filter.outputs.hosting }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PARTS+=("hosting")
          fi
          if [ "${{ steps.filter.outputs.functions }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PARTS+=("functions")
          fi
          if [ "${{ steps.filter.outputs.rules }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PARTS+=("firestore:rules" "firestore:indexes" "storage")
          fi
          if [ ${#PARTS[@]} -gt 0 ]; then
            ONLY=$(IFS=,; echo "${PARTS[*]}")
            echo "Deploying root resources: --only ${ONLY}"
            firebase deploy --only "${ONLY}" --project marriage-education --non-interactive
          fi

      - name: Deploy SBD Network Hosting
        if: steps.filter.outputs.sbdHosting == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: sbd-network
        run: |
          firebase deploy --only hosting:sbd-network --project marriage-education --non-interactive
