name: SBD Network CI

on:
  push:
    paths:
      - 'sbd-network/**'
      - '.github/workflows/sbd-network-ci.yml'
  pull_request:
    paths:
      - 'sbd-network/**'
      - '.github/workflows/sbd-network-ci.yml'

defaults:
  run:
    working-directory: sbd-network

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sbd-network/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: JS syntax check (all public/**/*.js)
        run: npm run validate

      - name: Build (HTML stamp + version.json)
        run: npm run build

  auth-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sbd-network/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Auth smoke test (live site)
        run: npm run test:smoke
        env:
          CI: true
