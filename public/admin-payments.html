<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Admin Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      padding: 20px;
    }
    .header {
      background: white;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 28px;
      color: #2d3436;
    }
    .stats {
      display: flex;
      gap: 20px;
    }
    .stat {
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #2d3436;
    }
    .stat-label {
      font-size: 12px;
      color: #636e72;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .filters {
      background: white;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .filter-group {
      display: flex;
      gap: 10px;
    }
    .filter-btn {
      padding: 8px 16px;
      border: 2px solid #dfe6e9;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s;
    }
    .filter-btn:hover {
      border-color: #FFCB05;
    }
    .filter-btn.active {
      background: #FFCB05;
      border-color: #FFCB05;
      color: #000;
    }
    .refresh-btn {
      margin-left: auto;
      padding: 8px 20px;
      background: #000;
      color: #FFCB05;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    .refresh-btn:hover {
      background: #333;
    }
    .payments-grid {
      display: grid;
      gap: 15px;
    }
    .payment-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: start;
      transition: transform 0.2s;
    }
    .payment-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .payment-info {
      display: grid;
      gap: 10px;
    }
    .payment-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
    }
    .reference {
      font-size: 18px;
      font-weight: 700;
      color: #2d3436;
      font-family: 'Courier New', monospace;
    }
    .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-pending {
      background: #fff3cd;
      color: #856404;
    }
    .status-approved {
      background: #d4edda;
      color: #155724;
    }
    .status-rejected {
      background: #f8d7da;
      color: #721c24;
    }
    .product-name {
      font-size: 16px;
      font-weight: 600;
      color: #2d3436;
    }
    .payment-amount {
      font-size: 24px;
      font-weight: 700;
      color: #FFCB05;
    }
    .payment-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .detail {
      display: flex;
      flex-direction: column;
    }
    .detail-label {
      font-size: 12px;
      color: #636e72;
      margin-bottom: 4px;
    }
    .detail-value {
      font-size: 14px;
      color: #2d3436;
      font-weight: 500;
    }
    .payment-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .action-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .approve-btn {
      background: #00b894;
      color: white;
    }
    .approve-btn:hover {
      background: #00a383;
    }
    .reject-btn {
      background: #d63031;
      color: white;
    }
    .reject-btn:hover {
      background: #c0392b;
    }
    .copy-btn {
      background: #636e72;
      color: white;
    }
    .copy-btn:hover {
      background: #4a5568;
    }
    .empty-state {
      background: white;
      border-radius: 12px;
      padding: 60px;
      text-align: center;
      color: #636e72;
    }
    .empty-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    .alert {
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .alert.show {
      display: block;
    }
    .alert.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .alert.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    }
    .login-container h2 {
      margin-bottom: 30px;
      text-align: center;
      color: #2d3436;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #2d3436;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #dfe6e9;
      border-radius: 8px;
      font-size: 16px;
    }
    .form-group input:focus {
      outline: none;
      border-color: #FFCB05;
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: #000;
      color: #FFCB05;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }
    .login-btn:hover {
      background: #333;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="login-container">
    <h2>🔐 Admin Login</h2>
    <form id="login-form">
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="admin-password" placeholder="Enter admin password" required>
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>
  </div>

  <!-- Admin Dashboard -->
  <div id="admin-dashboard" class="hidden">
    <div class="container">
      <div class="header">
        <h1>💰 Payment Management</h1>
        <div class="stats">
          <div class="stat">
            <div class="stat-value" id="pending-count">0</div>
            <div class="stat-label">Pending</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="approved-count">0</div>
            <div class="stat-label">Approved</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="total-amount">0</div>
            <div class="stat-label">Total (FCFA)</div>
          </div>
        </div>
      </div>

      <div id="alert" class="alert"></div>

      <div class="filters">
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="approved">Approved</button>
          <button class="filter-btn" data-filter="rejected">Rejected</button>
        </div>
        <button class="refresh-btn" onclick="loadPayments()">🔄 Refresh</button>
      </div>

      <div id="payments-container" class="payments-grid">
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <h3>No payments yet</h3>
          <p>Payments will appear here when customers submit manual MOMO transfers</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://marriage-education-website.onrender.com';
    let authToken = '';
    let currentFilter = 'all';
    let allPayments = [];

    // Show alert
    function showAlert(message, type) {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = `alert ${type} show`;
      setTimeout(() => alert.classList.remove('show'), 5000);
    }

    // Login
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const password = document.getElementById('admin-password').value;
      
      if (password === 'admin-secret-2024') { // Change this!
        authToken = 'Bearer admin-secret-2024';
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('admin-dashboard').classList.remove('hidden');
        loadPayments();
      } else {
        alert('Invalid password');
      }
    });

    // Load payments
    async function loadPayments() {
      try {
        showAlert('⏳ Loading payments from server... (Render free tier may take 30-60 seconds to wake up)', 'success');
        
        const response = await fetch(`${API_BASE}/admin/pending-payments`, {
          headers: { 'Authorization': authToken }
        });

        if (!response.ok) {
          if (response.status === 503) {
            throw new Error('Server is waking up. Please wait 30 seconds and refresh.');
          }
          throw new Error('Failed to load payments');
        }

        const data = await response.json();
        allPayments = data.payments || [];
        updateStats();
        renderPayments();
        showAlert(`✅ Loaded ${allPayments.length} payment(s)`, 'success');
      } catch (error) {
        console.error('Load error:', error);
        showAlert('❌ ' + error.message + ' - Try clicking Refresh', 'error');
      }
    }

    // Update stats
    function updateStats() {
      const pending = allPayments.filter(p => p.status === 'pending').length;
      const approved = allPayments.filter(p => p.status === 'approved').length;
      const total = allPayments
        .filter(p => p.status === 'approved')
        .reduce((sum, p) => sum + parseInt(p.amount), 0);

      document.getElementById('pending-count').textContent = pending;
      document.getElementById('approved-count').textContent = approved;
      document.getElementById('total-amount').textContent = total.toLocaleString();
    }

    // Render payments
    function renderPayments() {
      const container = document.getElementById('payments-container');
      
      let filteredPayments = allPayments;
      if (currentFilter !== 'all') {
        filteredPayments = allPayments.filter(p => p.status === currentFilter);
      }

      // Sort by newest first
      filteredPayments.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      if (filteredPayments.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <h3>No ${currentFilter} payments</h3>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredPayments.map(payment => `
        <div class="payment-card">
          <div class="payment-info">
            <div class="payment-header">
              <span class="reference">${payment.reference}</span>
              <span class="status-badge status-${payment.status}">${payment.status}</span>
            </div>
            <div class="product-name">${payment.product_name}</div>
            <div class="payment-amount">${parseInt(payment.amount).toLocaleString()} FCFA</div>
            <div class="payment-details">
              <div class="detail">
                <div class="detail-label">Phone</div>
                <div class="detail-value">${payment.phone}</div>
              </div>
              <div class="detail">
                <div class="detail-label">Email</div>
                <div class="detail-value">${payment.email}</div>
              </div>
              <div class="detail">
                <div class="detail-label">Product ID</div>
                <div class="detail-value">${payment.product_id}</div>
              </div>
              <div class="detail">
                <div class="detail-label">Submitted</div>
                <div class="detail-value">${new Date(payment.created_at).toLocaleString()}</div>
              </div>
            </div>
          </div>
          <div class="payment-actions">
            ${payment.status === 'pending' ? `
              <button class="action-btn approve-btn" onclick="approvePayment('${payment.reference}', '${payment.email}')">
                ✓ Approve
              </button>
              <button class="action-btn reject-btn" onclick="rejectPayment('${payment.reference}')">
                ✗ Reject
              </button>
            ` : ''}
            <button class="action-btn copy-btn" onclick="copyReference('${payment.reference}')">
              📋 Copy Ref
            </button>
          </div>
        </div>
      `).join('');
    }

    // Approve payment
    async function approvePayment(reference, email) {
      if (!confirm(`Approve payment ${reference}?\n\nDownload link will be sent to: ${email}`)) return;

      try {
        const response = await fetch(`${API_BASE}/admin/approve-payment`, {
          method: 'POST',
          headers: {
            'Authorization': authToken,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ reference })
        });

        const result = await response.json();

        if (response.ok) {
          const emailStatus = result.email_sent ? '✅ Email sent automatically!' : '⚠️ Email failed - copy link manually';
          showAlert(`✓ Payment approved! ${emailStatus}`, 'success');
          
          // Copy download URL to clipboard
          navigator.clipboard.writeText(result.download_url);
          
          // Reload payments
          await loadPayments();
          
          const expiryInfo = result.expires_at ? `\nExpires: ${new Date(result.expires_at).toLocaleString()}\nMax downloads: 5` : '';
          
          if (result.email_sent) {
            alert(`✅ Payment Approved!\n\n📧 Email sent automatically to: ${email}\n\nDownload link (also copied to clipboard):\n${result.download_url}${expiryInfo}`);
          } else {
            alert(`⚠️ Payment Approved BUT Email Failed!\n\n❗ IMPORTANT: Send this link to customer manually:\n${result.download_url}\n\nEmail: ${email}${expiryInfo}\n\n(Link copied to clipboard)`);
        } else {
          showAlert('Failed to approve payment', 'error');
        }
      } catch (error) {
        console.error('Approve error:', error);
        showAlert('Error approving payment', 'error');
      }
    }

    // Reject payment
    async function rejectPayment(reference) {
      const reason = prompt('Rejection reason (optional):') || 'Payment not verified';
      if (!reason) return;

      try {
        const response = await fetch(`${API_BASE}/admin/reject-payment`, {
          method: 'POST',
          headers: {
            'Authorization': authToken,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ reference, reason })
        });

        if (response.ok) {
          showAlert('Payment rejected', 'success');
          await loadPayments();
        } else {
          showAlert('Failed to reject payment', 'error');
        }
      } catch (error) {
        console.error('Reject error:', error);
        showAlert('Error rejecting payment', 'error');
      }
    }

    // Copy reference
    function copyReference(reference) {
      navigator.clipboard.writeText(reference).then(() => {
        showAlert('Reference copied!', 'success');
      });
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderPayments();
      });
    });

    // Auto-refresh every 30 seconds
    setInterval(loadPayments, 30000);
  </script>
</body>
</html>
