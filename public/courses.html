<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Marriage Counseling Courses - Certification Programs | Marriage Education</title>
  
  <!-- Primary Meta Tags -->
  <meta name="description" content="Professional marriage counseling and relationship coaching certification courses. Accredited programs for therapists, counselors, HR professionals, and coaches. Online self-paced learning with career support." />
  <meta name="keywords" content="marriage counseling courses, relationship coach certification, online certification programs, professional development courses, HR training courses, therapist certification, counseling education, marriage therapy training, corporate training courses" />
  <link rel="canonical" href="https://marriageducation.com/courses.html" />
  
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://marriageducation.com/courses.html" />
  <meta property="og:title" content="Professional Marriage Counseling Certification Courses" />
  <meta property="og:description" content="Accredited certification programs for marriage counselors and relationship coaches. Start your career transformation today." />
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://marriageducation.com/courses.html" />
  <meta property="twitter:title" content="Professional Marriage Counseling Certification Courses" />
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Courses</h1>
  <div id="courses-list"></div>
  <script>
    fetch('courses-catalogue.json?t=' + new Date().getTime())
      .then(response => response.json())
      .then(data => {
        const list = document.getElementById('courses-list');
        const courses = Array.isArray(data) ? data : [];
        if (courses.length > 0) {
          courses.forEach(course => {
            const div = document.createElement('div');
            div.className = 'course-card';
            div.innerHTML = `<h2>${course.title}</h2>
              <p>${course.description || ''}</p>
              <a href='course-viewer.html?id=${course.courseId}'>View Course</a>`;
            list.appendChild(div);
          });
        } else {
          list.innerHTML = '<p>No courses found.</p>';
        }
      })
      .catch(err => {
        document.getElementById('courses-list').innerHTML = '<p>Error loading courses: ' + err.message + '</p>';
      });
  </script>
  
  <!-- SEO Enhancements -->
  <script src="/js/seo-enhancements.js"></script>
  <script src="/js/analytics-tracking.js"></script>
  <script src="/js/performance-optimizations.js"></script>
</body>
</html>
