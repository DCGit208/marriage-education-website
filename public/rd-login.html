<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regional Director Login | Marriage Education</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="js/role-login-shell.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent: #667eea;
            --accent-gradient: linear-gradient(135deg, #667eea, #764ba2);
        }
        .login-header .role-icon { color: #667eea; }
    </style>
</head>
<body data-login-role="regional_director">
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-crown role-icon"></i>
            <h1>Regional Director Login</h1>
            <p>Regional command · code format <strong>RD-…</strong> (not AMB-)</p>
        </div>
        <div id="loggedOutNote" class="logged-out-note">You have been logged out. Sign in with your RD-… code and email.</div>
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="rdCode"><i class="fas fa-id-badge"></i> Regional Director Code</label>
                <input type="text" id="rdCode" required placeholder="RD-YOURNAME-1234" style="text-transform:uppercase" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="email" required placeholder="your@email.com" autocomplete="email">
            </div>
            <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Login to RD Dashboard</button>
        </form>
        <div class="other-logins">
            <p>Not a Regional Director?</p>
            <a href="senior-login.html"><i class="fas fa-star"></i> Senior Ambassador Login (AMB-…)</a>
            <a href="ambassador-login.html"><i class="fas fa-user"></i> Ambassador Login (AMB-…)</a>
            <a href="executive-login.html"><i class="fas fa-earth-americas"></i> Executive Login</a>
        </div>
        <a class="home-link" href="rd-register.html">Apply to become a Regional Director</a>
        <a class="home-link" href="index.html"><i class="fas fa-home"></i> Back to Home</a>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/ambassador-session.js?v=20260524b"></script>
    <script src="js/ambassador-account-resolve.js?v=20260524b"></script>
    <script src="js/ambassador-routes.js?v=20260524b"></script>
    <script src="js/role-login.js?v=20260524b"></script>
    <script>MERoleLogin.init('regional_director');</script>
</body>
</html>
