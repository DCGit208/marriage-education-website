<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import Courses to Firestore</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 2.5rem;
      color: #1e293b;
      margin-bottom: 20px;
    }
    .stats {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .stat-item {
      text-align: center;
    }
    .stat-item .number {
      font-size: 2.5rem;
      font-weight: bold;
    }
    .stat-item .label {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .import-btn {
      background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
      color: white;
      border: none;
      padding: 16px 40px;
      font-size: 1.1rem;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(74, 222, 128, 0.4);
      transition: all 0.3s;
      margin: 20px 0;
    }
    .import-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(74, 222, 128, 0.5);
    }
    .import-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      margin: 20px 0;
      padding: 15px;
      border-radius: 8px;
      font-weight: 500;
    }
    .status.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .status.info {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #93c5fd;
    }
    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .course-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .course-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    .course-card h3 {
      color: #1e293b;
      margin-bottom: 10px;
    }
    .course-card .course-id {
      color: #64748b;
      font-size: 0.85rem;
      font-family: monospace;
      background: white;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 10px;
    }
    .course-card .modules {
      margin-top: 10px;
      color: #475569;
    }
    .course-card .modules strong {
      color: #667eea;
    }
    .progress-bar {
      background: #e2e8f0;
      height: 8px;
      border-radius: 10px;
      overflow: hidden;
      margin: 20px 0;
    }
    .progress-fill {
      background: linear-gradient(90deg, #667eea, #764ba2);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Import Courses to Firestore</h1>
    
    <div class="stats">
      <div class="stat-item">
        <div class="number" id="totalCourses">0</div>
        <div class="label">Total Courses</div>
      </div>
      <div class="stat-item">
        <div class="number" id="totalModules">0</div>
        <div class="label">Total Modules</div>
      </div>
      <div class="stat-item">
        <div class="number" id="totalLessons">0</div>
        <div class="label">Total Lessons</div>
      </div>
    </div>

    <button class="import-btn" id="importBtn" onclick="importCourses()">
      🚀 Import All Courses to Firestore
    </button>

    <div id="statusMessage"></div>
    <div class="progress-bar" id="progressContainer" style="display:none;">
      <div class="progress-fill" id="progressBar"></div>
    </div>

    <div class="courses-grid" id="coursesList"></div>
  </div>

  <script>
    let coursesData = [];
    
    fetch('../courses-catalogue.json?t=' + new Date().getTime())
      .then(response => response.json())
      .then(data => {
        coursesData = Array.isArray(data) ? data : [];
        displayCourses();
        updateStats();
      })
      .catch(err => {
        showStatus('Error loading courses: ' + err.message, 'error');
      });

    function displayCourses() {
      const container = document.getElementById('coursesList');
      let html = '';
      
      coursesData.forEach(course => {
        const moduleCount = course.modules ? course.modules.length : 0;
        html += `
          <div class="course-card">
            <h3>${course.title}</h3>
            <div class="course-id">${course.courseId}</div>
            <div class="modules">
              <strong>${moduleCount}</strong> module${moduleCount !== 1 ? 's' : ''}
            </div>
          </div>
        `;
      });
      
      container.innerHTML = html;
    }

    function updateStats() {
      let totalModules = 0;
      let totalLessons = 0;
      
      coursesData.forEach(course => {
        if (course.modules) {
          totalModules += course.modules.length;
          course.modules.forEach(module => {
            if (module.lessons) totalLessons += module.lessons.length;
          });
        }
      });

      document.getElementById('totalCourses').textContent = coursesData.length;
      document.getElementById('totalModules').textContent = totalModules;
      document.getElementById('totalLessons').textContent = totalLessons;
    }

    function showStatus(message, type = 'info') {
      const statusDiv = document.getElementById('statusMessage');
      statusDiv.className = 'status ' + type;
      statusDiv.textContent = message;
    }

    async function importCourses() {
      if (!firebase.apps.length) {
        showStatus('Firebase not initialized. Check firebase-config.js', 'error');
        return;
      }

      const btn = document.getElementById('importBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Importing...';

      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      progressContainer.style.display = 'block';

      const db = firebase.firestore();
      const batch = db.batch();
      let imported = 0;

      try {
        showStatus(`Starting import of ${coursesData.length} courses...`, 'info');

        for (let i = 0; i < coursesData.length; i++) {
          const course = coursesData[i];
          const courseRef = db.collection('courses').doc(course.courseId);
          
          batch.set(courseRef, {
            courseId: course.courseId,
            title: course.title,
            description: course.description || '',
            duration_weeks: course.duration_weeks || 6,
            price_usd: course.price_usd || 0,
            modules: course.modules || [],
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          imported++;
          const progress = (imported / coursesData.length) * 100;
          progressBar.style.width = progress + '%';
        }

        await batch.commit();

        showStatus(`✅ Successfully imported ${imported} courses to Firestore!`, 'success');
        btn.textContent = '✓ Import Complete';
        
      } catch (error) {
        showStatus(`❌ Error: ${error.message}`, 'error');
        btn.disabled = false;
        btn.textContent = '🚀 Import All Courses to Firestore';
      }
    }
  </script>
</body>
</html>
