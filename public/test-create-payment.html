<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Test Payment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            margin-bottom: 30px;
            color: #2d3436;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3436;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            font-size: 16px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .result.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Create Test Payment</h1>
        <form id="test-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" value="test@marriageducation.com" required>
            </div>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="name" value="Test Customer" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="phone" value="+237670000000" required>
            </div>
            <div class="form-group">
                <label>Product</label>
                <select id="product" required>
                    <option value="sbd-for-dummies">SBD For Dummies (5,000 FCFA)</option>
                    <option value="complete-sbd-library">Complete SBD Library (15,000 FCFA)</option>
                    <option value="the-arts-of-marriage">The Arts of Marriage (7,500 FCFA)</option>
                </select>
            </div>
            <div class="form-group">
                <label>MOMO Number</label>
                <input type="tel" id="momo" value="670000000" required>
            </div>
            <button type="submit" class="btn" id="submit-btn">
                Create Test Payment
            </button>
        </form>
        <div id="result" class="result"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>

    <script>
        const products = {
            'sbd-for-dummies': { name: 'SBD For Dummies', price: 5000 },
            'complete-sbd-library': { name: 'Complete SBD Library', price: 15000 },
            'the-arts-of-marriage': { name: 'The Arts of Marriage', price: 7500 }
        };

        document.getElementById('test-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            const resultDiv = document.getElementById('result');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';
            
            try {
                const email = document.getElementById('email').value;
                const name = document.getElementById('name').value;
                const phone = document.getElementById('phone').value;
                const productId = document.getElementById('product').value;
                const momo = document.getElementById('momo').value;
                
                const product = products[productId];
                const reference = `TEST-${Date.now()}`;
                
                // Create test payment in Firestore
                await db.collection('pending_payments').doc(reference).set({
                    reference: reference,
                    email: email,
                    name: name,
                    phone: phone,
                    product_id: productId,
                    product_name: product.name,
                    amount: product.price,
                    currency: 'FCFA',
                    payment_method: 'MOMO',
                    status: 'pending',
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    momo_number: momo,
                    ambassador_ref: null,
                    referral_code: null,
                    rd_code: null
                });
                
                resultDiv.className = 'result success show';
                resultDiv.innerHTML = `
                    <strong>✅ Test Payment Created!</strong><br><br>
                    <strong>Reference:</strong> ${reference}<br>
                    <strong>Email:</strong> ${email}<br>
                    <strong>Product:</strong> ${product.name}<br>
                    <strong>Amount:</strong> ${product.price} FCFA<br><br>
                    Now go to the <a href="admin-dashboard.html" style="color: #667eea; font-weight: bold;">Administrative Dashboard</a> to approve it!
                `;
                
                // Reset form
                e.target.reset();
                document.getElementById('email').value = 'test@marriageducation.com';
                document.getElementById('name').value = 'Test Customer';
                document.getElementById('phone').value = '+237670000000';
                document.getElementById('momo').value = '670000000';
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.className = 'result error show';
                resultDiv.innerHTML = `<strong>❌ Error:</strong> ${error.message}`;
            }
            
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Test Payment';
        });
    </script>
  <!-- Marriage Education Chatbot -->
  <script src="marriage-chatbot.js"></script>
</body>
</html>
