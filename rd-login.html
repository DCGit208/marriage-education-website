<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regional Director Login | Marriage Education</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            padding: 40px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section i {
            font-size: 64px;
            color: #667eea;
            margin-bottom: 20px;
            display: block;
        }

        .logo-section h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .logo-section p {
            color: #666;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            display: block;
            margin: 10px 0;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            color: #999;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #ddd;
        }

        .divider::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #ddd;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .logo-section h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <i class="fas fa-crown"></i>
            <div style="background: #ffc107; color: #333; padding: 6px 12px; border-radius: 6px; display: inline-block; font-size: 12px; font-weight: bold; margin-bottom: 10px;">🔥 FIREBASE TEST</div>
            <h1>Regional Director</h1>
            <p>Login to Your Dashboard</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="rdCode"><i class="fas fa-id-badge"></i> Regional Director Code</label>
                <input type="text" id="rdCode" name="rdCode" placeholder="e.g., RD-JOHN-1234" required style="text-transform: uppercase;">
            </div>

            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Login to Dashboard
            </button>
        </form>

        <div class="divider">or</div>

        <div class="links">
            <a href="rd-register.html"><i class="fas fa-crown"></i> Apply to Become a Regional Director</a>
            <a href="ambassador-login.html"><i class="fas fa-user"></i> Ambassador Login</a>
            <a href="index.html"><i class="fas fa-home"></i> Back to Home</a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>

    <script>
        // Initialize Firebase directly
        const firebaseConfig = {
            apiKey: "AIzaSyDK2FjzMM5cZ6zkpz89LieauLDTBT8DzYc",
            authDomain: "marriage-education.firebaseapp.com",
            projectId: "marriage-education",
            storageBucket: "marriage-education.firebasestorage.app",
            messagingSenderId: "730854285800",
            appId: "1:730854285800:web:2176d278397398fd41045d"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // Firebase Cloud Functions
        const functions = firebase.functions();
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');

        function hideMessages() {
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
        }

        function showSuccess(message) {
            successMsg.textContent = message;
            successMsg.style.display = 'block';
            errorMsg.style.display = 'none';
        }

        // Auto-fill RD code from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const codeParam = urlParams.get('code');
        if (codeParam) {
            document.getElementById('rdCode').value = codeParam.toUpperCase();
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const rdCode = document.getElementById('rdCode').value.toUpperCase();
            const email = document.getElementById('email').value.toLowerCase();
            
            const submitBtn = this.querySelector('.btn-login');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            
            hideMessages();
            
            try {
                // Call Firebase Cloud Function
                const getRDStats = functions.httpsCallable('getRDStats');
                const result = await getRDStats({ code: rdCode, email: email });
                
                if (!result.data.success || !result.data.rd) {
                    throw new Error('Invalid Regional Director code or email. Please try again.');
                }
                
                const rd = result.data.rd;
                
                // Check payment status
                if (rd.status === 'pending_payment') {
                    throw new Error('Your payment is pending. Please complete payment to activate your account. Check your email for instructions.');
                }
                
                // Store RD data in localStorage
                localStorage.setItem('rdCode', rdCode);
                localStorage.setItem('rdEmail', email);
                localStorage.setItem('rdName', rd.name);
                localStorage.setItem('rdData', JSON.stringify(rd));
                
                // Show success
                showSuccess('✅ Login successful! Redirecting to dashboard...');
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'regional-director/dashboard.html';
                }, 1500);
                
            } catch (error) {
                console.error('Login error:', error);
                
                let errorMessage = 'Login failed. Please try again.';
                
                if (error.code === 'functions/not-found') {
                    errorMessage = 'Regional Director code not found. Please check your code or apply.';
                } else if (error.code === 'functions/permission-denied') {
                    errorMessage = 'Email does not match our records. Please check and try again.';
                } else if (error.code === 'functions/invalid-argument') {
                    errorMessage = 'Please provide both RD code and email address.';
                } else if (error.message) {
                    errorMessage = error.message;
                }
                
                showError(errorMessage);
                
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login to Dashboard';
            }
        });
    </script>
</body>
</html>
