<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Courses from JSON - Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .info-box {
            background: #ebf8ff;
            border-left: 4px solid #3182ce;
            padding: 16px;
            margin-bottom: 30px;
            border-radius: 8px;
        }
        .info-box h3 {
            color: #2c5282;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .info-box p {
            color: #2d3748;
            line-height: 1.6;
        }
        .action-section {
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 16px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        .btn-secondary:hover {
            background: #f7fafc;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.2);
        }
        .status {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .status.success {
            background: #c6f6d5;
            border-left: 4px solid #38a169;
            color: #22543d;
            display: block;
        }
        .status.error {
            background: #fed7d7;
            border-left: 4px solid #e53e3e;
            color: #742a2a;
            display: block;
        }
        .status.info {
            background: #bee3f8;
            border-left: 4px solid #3182ce;
            color: #2c5282;
            display: block;
        }
        .progress {
            margin-top: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            color: #4a5568;
            font-size: 14px;
            text-align: center;
        }
        .course-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .course-item {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .course-item:last-child {
            border-bottom: none;
        }
        .course-title {
            font-weight: 500;
            color: #2d3748;
        }
        .course-meta {
            color: #718096;
            font-size: 14px;
        }
        .badge {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Import Courses from JSON</h1>
        <p class="subtitle">Sync courses-catalogue.json to Firebase</p>

        <div class="info-box">
            <h3>How This Works</h3>
            <p><strong>Step 1:</strong> Click "Load JSON File" to read courses-catalogue.json<br>
            <strong>Step 2:</strong> Review the courses that will be imported<br>
            <strong>Step 3:</strong> Click "Import to Firebase" to sync all courses to the database</p>
        </div>

        <div id="status" class="status"></div>

        <div class="action-section">
            <button class="btn" onclick="loadJSON()">📂 Load JSON File</button>
            <button class="btn btn-secondary" onclick="importToFirebase()" id="importBtn" disabled>🚀 Import to Firebase</button>
        </div>

        <div id="courseList" class="course-list" style="display: none;"></div>

        <div class="progress" id="progressContainer" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 0 courses imported</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getFirestore, collection, doc, setDoc, getDocs } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';

        // Import Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyBnKMGPBu9LNi2_NfU6OhfxP3_2TmqY4jE",
            authDomain: "marriage-education.firebaseapp.com",
            projectId: "marriage-education",
            storageBucket: "marriage-education.firebasestorage.app",
            messagingSenderId: "257768723041",
            appId: "1:257768723041:web:7c3f8f5e7d3e8f5e7d3e8f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let coursesData = [];

        window.loadJSON = async function() {
            showStatus('Loading JSON file...', 'info');
            try {
                const response = await fetch('../courses-catalogue.json');
                if (!response.ok) throw new Error('Failed to load JSON file');
                
                coursesData = await response.json();
                
                if (!Array.isArray(coursesData) || coursesData.length === 0) {
                    throw new Error('JSON file is empty or invalid');
                }

                displayCourses(coursesData);
                document.getElementById('importBtn').disabled = false;
                showStatus(`✅ Loaded ${coursesData.length} courses successfully!`, 'success');
            } catch (error) {
                showStatus(`❌ Error loading JSON: ${error.message}`, 'error');
                console.error('Load error:', error);
            }
        };

        function displayCourses(courses) {
            const container = document.getElementById('courseList');
            container.style.display = 'block';
            container.innerHTML = '';

            courses.forEach((course, index) => {
                const item = document.createElement('div');
                item.className = 'course-item';
                item.innerHTML = `
                    <div>
                        <div class="course-title">${index + 1}. ${course.title}</div>
                        <div class="course-meta">
                            ${course.school_name} • $${course.price} • ${course.duration_weeks || 'N/A'} weeks
                        </div>
                    </div>
                    <div class="badge">${course.courseId}</div>
                `;
                container.appendChild(item);
            });
        }

        window.importToFirebase = async function() {
            if (coursesData.length === 0) {
                showStatus('❌ No courses loaded. Click "Load JSON File" first.', 'error');
                return;
            }

            if (!confirm(`Import ${coursesData.length} courses to Firebase?\n\nThis will overwrite any existing courses with the same IDs.`)) {
                return;
            }

            document.getElementById('importBtn').disabled = true;
            document.getElementById('progressContainer').style.display = 'block';
            
            let imported = 0;
            let errors = 0;

            for (let i = 0; i < coursesData.length; i++) {
                const course = coursesData[i];
                try {
                    // Add metadata
                    const courseData = {
                        ...course,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString(),
                        published: course.published !== undefined ? course.published : false,
                        enrollmentCount: 0,
                        modules: course.modules || []
                    };

                    await setDoc(doc(db, 'courses', course.courseId), courseData);
                    imported++;
                } catch (error) {
                    console.error(`Error importing ${course.courseId}:`, error);
                    errors++;
                }

                // Update progress
                const progress = ((i + 1) / coursesData.length) * 100;
                document.getElementById('progressFill').style.width = progress + '%';
                document.getElementById('progressText').textContent = 
                    `${i + 1} / ${coursesData.length} courses processed`;
            }

            // Final status
            if (errors === 0) {
                showStatus(`🎉 Successfully imported all ${imported} courses to Firebase!`, 'success');
            } else {
                showStatus(`⚠️ Imported ${imported} courses with ${errors} errors. Check console for details.`, 'error');
            }

            document.getElementById('importBtn').disabled = false;
        };

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }

        // Expose db globally for debugging
        window.db = db;
    </script>
</body>
</html>
