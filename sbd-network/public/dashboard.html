<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="SBD Network Dashboard">
    <meta name="theme-color" content="#000000">
    <title>Dashboard - SBD Network</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/bottom-nav.css?v=40">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
</head>
<body class="dashboard-page bottom-nav-page">
    
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <h1 class="app-logo">SBD Network</h1>
        </div>
        <div class="header-right">
            <span id="userNameDisplay" class="user-name"></span>
            <button class="notif-bell-btn btn btn-icon" aria-label="Notifications" title="Notifications">
                🔔<span class="notif-badge" style="display:none;"></span>
            </button>
            <button id="logoutBtn" class="btn btn-secondary btn-sm">Logout</button>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="dashboard-main">
        
        <!-- Welcome Section -->
        <section class="welcome-section">
            <h2 id="welcomeTitle">Welcome back!</h2>
            <p class="welcome-subtitle">Continue your learning journey</p>
        </section>
        
        <!-- My Groups Section -->
        <section class="dashboard-section">
            <div class="section-header">
                <h3>My Groups</h3>
                <button id="adminPanelBtn" class="btn btn-link" style="display: none;">
                    Admin Panel
                </button>
            </div>
            
            <div id="myGroupsContainer" class="groups-grid">
                <div class="skel-card"><div class="skel-icon"></div><div class="skel-line w60"></div><div class="skel-line w80"></div><div class="skel-line w40"></div></div>
                <div class="skel-card"><div class="skel-icon"></div><div class="skel-line w80"></div><div class="skel-line w60"></div><div class="skel-line w40"></div></div>
            </div>
            
            <div id="noGroupsMessage" class="empty-state" style="display: none;">
                <p>You haven't joined any groups yet.</p>
                <p>Contact an admin to get added to groups.</p>
            </div>
        </section>
        
    </main>
    
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- What's New Modal -->
    <div id="whatsNewModal" style="display:none;position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,0.75);align-items:flex-end;">
      <div style="background:var(--bg-card);border-radius:20px 20px 0 0;width:100%;max-height:80vh;display:flex;flex-direction:column;">
        <div style="padding:20px 20px 14px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;gap:12px;">
          <span id="whatsNewEmoji" style="font-size:1.8rem;flex-shrink:0;">🚀</span>
          <div style="flex:1;min-width:0;">
            <div style="font-size:0.65rem;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px;">What's New</div>
            <div id="whatsNewTitle" style="font-size:1rem;font-weight:700;color:var(--text-primary);line-height:1.3;"></div>
          </div>
          <button id="whatsNewClose" type="button" style="background:rgba(255,255,255,0.08);border:none;color:var(--text-secondary);font-size:1rem;width:34px;height:34px;border-radius:50%;cursor:pointer;flex-shrink:0;" aria-label="Close">✕</button>
        </div>
        <ul id="whatsNewList" style="flex:1;overflow-y:auto;padding:14px 20px;margin:0;list-style:none;display:flex;flex-direction:column;gap:12px;"></ul>
        <div style="padding:14px 20px 32px;">
          <button id="whatsNewDone" type="button" class="btn btn-primary" style="width:100%;padding:14px;">Got it 👍</button>
        </div>
      </div>
    </div>

    <!-- Notification Panel -->
    <div id="notifOverlay" class="notif-overlay" style="display:none;"></div>
    <div id="notifPanel" class="notif-panel">
        <div class="notif-panel-header">
            <h3>Notifications</h3>
            <button id="notifPanelClose" class="btn btn-icon" aria-label="Close">✕</button>
        </div>
        <ul id="notifList" class="notif-list"></ul>
    </div>
    
    <!-- Firebase SDKs -->
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
    
    <!-- App Scripts -->
    <script defer src="/js/firebase.js?v=52"></script>
    <script defer src="/js/notifications.js?v=52"></script>
    <script defer src="/js/dm-badge.js?v=52"></script>
    <script defer src="/js/ptr.js?v=52"></script>
    <script defer src="/js/dashboard.js?v=52"></script>
    <script defer src="/js/transitions.js?v=52"></script>
    <script defer src="/js/swipe-back.js?v=52"></script>
    <script defer src="/js/install-prompt.js?v=52"></script>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="/dashboard.html" class="bn-tab active" aria-label="Home">
      <span class="bn-icon">🏠</span>
      <span class="bn-label">Home</span>
    </a>
    <a href="/explore.html" class="bn-tab" aria-label="Explore">
      <span class="bn-icon">🔍</span>
      <span class="bn-label">Explore</span>
    </a>
    <a href="/dm.html" class="bn-tab" aria-label="Messages">
      <span class="bn-icon">💬<span class="dm-badge" style="display:none;"></span></span>
      <span class="bn-label">Messages</span>
    </a>
    <a href="/boards.html" class="bn-tab" aria-label="Boards">
      <span class="bn-icon">📋</span>
      <span class="bn-label">Boards</span>
    </a>
    <a href="/profile.html" class="bn-tab" aria-label="Profile">
      <span class="bn-icon">👤</span>
      <span class="bn-label">Profile</span>
    </a>
  </nav>
  <script defer src="/js/offline.js?v=52"></script>
</body>
</html>
