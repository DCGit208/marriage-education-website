<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0D0D0D">
    <title>Lesson | SBD Network</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
    <link rel="stylesheet" href="/css/bottom-nav.css?v=40">

    <style>
        :root {
            --bg:       #0D0D0D;
            --surface:  #151515;
            --gold:     #C6A96B;
            --gold-dim: rgba(198,169,107,0.15);
            --text:     #EAE3D2;
            --text-sec: #A8A29E;
            --border:   rgba(255,255,255,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Georgia', serif;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* ——— TOP BAR ——— */
        .lesson-topbar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
        }
        .lesson-back {
            color: var(--gold);
            text-decoration: none;
            font-size: 20px;
            line-height: 1;
            flex-shrink: 0;
        }
        .lesson-topbar-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sec);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ——— HERO ——— */
        .lesson-hero {
            padding: 36px 24px 28px;
            border-bottom: 1px solid var(--border);
        }
        .lesson-meta {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 12px;
        }
        .lesson-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.25;
            margin-bottom: 10px;
        }
        .lesson-subtitle {
            font-size: 15px;
            color: var(--text-sec);
            line-height: 1.5;
        }

        /* ——— CONTENT BODY ——— */
        .lesson-body {
            max-width: 680px;
            margin: 0 auto;
            padding: 32px 24px 48px;
        }

        /* Markdown rendering */
        .lesson-body h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--gold);
            margin: 36px 0 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .lesson-body h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin: 24px 0 8px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .lesson-body p {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text);
            margin-bottom: 16px;
        }
        .lesson-body blockquote {
            border-left: 3px solid var(--gold);
            margin: 20px 0;
            padding: 12px 20px;
            background: var(--gold-dim);
            border-radius: 0 8px 8px 0;
            font-style: italic;
            color: var(--text-sec);
            font-size: 15px;
            line-height: 1.7;
        }
        .lesson-body blockquote strong {
            color: var(--text);
            font-style: normal;
        }
        .lesson-body ul, .lesson-body ol {
            margin: 12px 0 20px 20px;
        }
        .lesson-body li {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text);
            margin-bottom: 6px;
        }
        .lesson-body strong {
            color: var(--text);
            font-weight: 700;
        }
        .lesson-body em {
            color: var(--text-sec);
        }
        .lesson-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 32px 0;
        }

        /* Key concept callout */
        .key-concept {
            background: var(--surface);
            border: 1px solid rgba(198,169,107,0.3);
            border-radius: 10px;
            padding: 16px 20px;
            margin: 20px 0;
        }
        .key-concept-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 8px;
        }

        /* ——— LOADING / ERROR ——— */
        .lesson-loading {
            text-align: center;
            padding: 60px 24px;
            color: var(--text-sec);
            font-size: 15px;
        }

        /* ——— UPGRADE WALL ——— */
        .lesson-upgrade-wall {
            margin: 32px 24px;
            background: var(--surface);
            border: 1px solid rgba(198,169,107,0.3);
            border-radius: 16px;
            padding: 36px 28px;
            text-align: center;
        }
        .lesson-upgrade-wall h3 {
            font-size: 20px;
            color: var(--gold);
            margin-bottom: 10px;
        }
        .lesson-upgrade-wall p {
            font-size: 14px;
            color: var(--text-sec);
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .btn-upgrade {
            display: inline-block;
            background: var(--gold);
            color: #0D0D0D;
            font-size: 14px;
            font-weight: 700;
            padding: 13px 32px;
            border-radius: 8px;
            text-decoration: none;
        }
        .btn-upgrade:hover { opacity: 0.88; }

        /* ——— FREE LIMIT NOTICE ——— */
        .free-limit-notice {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin: 32px 0;
            color: var(--text-sec);
            font-size: 14px;
            line-height: 1.6;
        }
        .free-limit-notice a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
        }

        /* ——— PART BREADCRUMB ——— */
        .part-breadcrumb {
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .part-breadcrumb-back {
            font-size: 12px;
            color: var(--text-sec);
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: color 0.2s;
        }
        .part-breadcrumb-back:hover { color: var(--gold); }
        .part-breadcrumb-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--text-sec);
        }

        /* ——— PARTS INDEX ——— */
        .parts-index {
            padding-bottom: 32px;
        }
        .parts-index-intro {
            font-size: 13px;
            color: var(--text-sec);
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .parts-track-group {
            margin-top: 24px;
        }
        .parts-track-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-sec);
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0;
            display: block;
        }
        .part-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .part-row:hover:not(.part-row--locked) .part-row-title { color: var(--gold); }
        .part-row--locked {
            opacity: 0.38;
            cursor: not-allowed;
            pointer-events: none;
        }
        .part-status {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-sec);
        }
        .part-status--done {
            background: rgba(198,169,107,0.18);
            border-color: var(--gold);
            color: var(--gold);
        }
        .part-status--available {
            border-color: rgba(198,169,107,0.45);
            color: var(--gold);
        }
        .part-info { flex: 1; min-width: 0; }
        .part-row-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
            margin-bottom: 3px;
            transition: color 0.2s;
        }
        .part-track-badge {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .part-track-badge--teleios {
            background: rgba(198,169,107,0.12);
            color: var(--gold);
        }
        .part-track-badge--advocacy {
            background: rgba(100,160,255,0.1);
            color: #7ab4ff;
        }
        .part-row-arrow {
            color: var(--gold);
            font-size: 14px;
            opacity: 0.55;
            flex-shrink: 0;
        }
        .part-row--done .part-row-arrow { opacity: 0.3; }

        /* ——— COMPLETE BUTTON ——— */
        .part-complete-section {
            margin-top: 40px;
            padding-top: 28px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .btn-complete {
            background: var(--gold);
            color: #0D0D0D;
            border: none;
            padding: 15px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            transition: all 0.25s ease;
        }
        .btn-complete:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(198,169,107,0.35);
        }
        .btn-complete:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-back-index {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-sec);
            padding: 11px 24px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-back-index:hover { border-color: var(--gold); color: var(--gold); }
        .completion-done-note {
            font-size: 13px;
            color: var(--gold);
            font-weight: 600;
            text-align: center;
        }

        /* ——— WEEK COMPLETE ——— */
        .week-complete-block {
            text-align: center;
            padding: 48px 24px 32px;
        }
        .week-complete-icon { font-size: 2.8rem; margin-bottom: 16px; }
        .week-complete-block h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 10px;
        }
        .week-complete-block p {
            font-size: 14px;
            color: var(--text-sec);
            line-height: 1.6;
            margin-bottom: 24px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }
        .week-complete-links { display: flex; flex-direction: column; align-items: center; gap: 12px; }

        /* ——— NEXT WEEK LOCKED CARD ——— */
        .next-week-locked {
            margin: 8px 0 0;
            background: var(--surface);
            border: 1px solid rgba(198,169,107,0.35);
            border-radius: 16px;
            overflow: hidden;
            text-align: left;
        }
        .next-week-locked-header {
            padding: 16px 20px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .next-week-locked-eyebrow {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 6px;
        }
        .next-week-locked-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }
        .next-week-locked-sub {
            font-size: 13px;
            color: var(--text-sec);
            line-height: 1.5;
        }
        .next-week-parts-preview {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .next-week-part-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 13px;
            color: var(--text-sec);
        }
        .next-week-part-item:last-child { border-bottom: none; }
        .next-week-part-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            flex-shrink: 0;
            color: var(--text-sec);
        }
        .next-week-cta-row {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .next-week-price-note {
            font-size: 12px;
            color: var(--text-sec);
            text-align: center;
        }
        .next-week-price-note strong { color: var(--gold); }
        .week-complete-discuss-link {
            display: block;
            text-align: center;
            font-size: 13px;
            color: var(--gold);
            text-decoration: none;
            margin-top: 18px;
            opacity: 0.85;
        }
        .week-complete-discuss-link:hover { opacity: 1; text-decoration: underline; }
    </style>
</head>
<body class="bottom-nav-page">

    <!-- TOP BAR -->
    <div class="lesson-topbar">
        <a href="/learn.html" class="lesson-back" id="lessonBackBtn">←</a>
        <div class="lesson-topbar-title" id="topbarTitle">Loading…</div>
    </div>

    <!-- HERO -->
    <div class="lesson-hero">
        <div class="lesson-meta" id="lessonMeta">Teleios Blueprint · Week 1 · Free</div>
        <h1 class="lesson-title" id="lessonTitle">Loading…</h1>
        <p class="lesson-subtitle" id="lessonSubtitle"></p>
    </div>

    <!-- PART INDEX NAV (shown inside part view) -->
    <div class="part-breadcrumb" id="partBreadcrumb" style="display:none"></div>

    <!-- LESSON CONTENT -->
    <div class="lesson-body" id="lessonBody">
        <div class="lesson-loading">Loading lesson content…</div>
    </div>

    <!-- UPGRADE WALL (shown for locked parts) -->
    <div class="lesson-upgrade-wall" id="upgradeWall" style="display:none">
        <h3>Continue Your Formation</h3>
        <p>You've seen the foundation. The full Teleios Blueprint — all 6 weeks — is available at Foundation tier.</p>
        <a href="/payment?tier=foundation" class="btn-upgrade">Unlock Foundation — $9/mo →</a>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="/js/firebase.js?v=75"></script>

    <script>
        const params   = new URLSearchParams(location.search);
        const moduleId = params.get('moduleId') || 'teleios-week-1';
        const partId   = params.get('part'); // null = show parts index

        const TIER_ORDER = { free: 0, foundation: 1, premium: 2, elite: 3 };

        let _lessonUser    = null;
        let userTier       = 'free';
        let currentMod     = null;
        let completedParts = [];

        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '/auth?next=' + encodeURIComponent(location.pathname + location.search);
                return;
            }
            _lessonUser = user;

            // ── Load user tier ──────────────────────────────────
            let uData = null;
            try {
                const uDoc = await firebase.firestore().collection('users').doc(user.uid).get();
                if (uDoc.exists) {
                    uData = uDoc.data();
                    const sub    = uData.subscription || {};
                    const now    = Date.now();
                    const subEnd = sub.endDate?.toMillis ? sub.endDate.toMillis() : 0;
                    const active = sub.status === 'active' && subEnd > now ? sub.tier : '';
                    userTier = uData.role === 'admin' ? 'elite' : (active || 'free');
                }
            } catch (e) { console.error('tier load', e); }

            // ── Load module ─────────────────────────────────────
            try {
                const mDoc = await firebase.firestore().collection('modules').doc(moduleId).get();
                if (!mDoc.exists) { showError('Module not found.'); return; }
                currentMod = mDoc.data();
            } catch (e) { showError('Failed to load content. Please refresh.'); return; }

            // ── Module-level tier check ──────────────────────────
            const requiredTier = currentMod.requiredTier || currentMod.accessLevel || 'free';
            if (TIER_ORDER[userTier] < TIER_ORDER[requiredTier]) {
                showUpgradeWall(requiredTier, currentMod.title);
                return;
            }

            // ── Load progress ───────────────────────────────────
            if (uData) {
                const prog = uData.progress || {};
                completedParts = (prog[moduleId] || {}).completedParts || [];
            }

            // ── Route ───────────────────────────────────────────
            const hasParts = Array.isArray(currentMod.parts) && currentMod.parts.length > 0;
            if (hasParts) {
                partId ? renderPart(partId) : renderPartsIndex();
            } else {
                renderLegacyContent();
            }
        });

        // ── PARTS INDEX ─────────────────────────────────────────
        function renderPartsIndex() {
            const parts = currentMod.parts;

            document.getElementById('lessonBackBtn').href      = '/learn.html';
            document.getElementById('topbarTitle').textContent = currentMod.title || 'Lesson';
            document.getElementById('lessonMeta').textContent  =
                'Week ' + (currentMod.week || 1) + ' of 6 · ' + parts.length + ' parts';
            document.getElementById('lessonTitle').textContent    = currentMod.title || 'Week 1';
            document.getElementById('lessonSubtitle').textContent = 'Complete each part in sequence to finish this week.';

            const teleiosParts  = parts.filter(p => p.track === 'teleios');
            const advocacyParts = parts.filter(p => p.track === 'advocacy');

            function partRow(p) {
                const idx         = parts.findIndex(x => x.id === p.id);
                const prev        = parts[idx - 1];
                const isDone      = completedParts.includes(p.id);
                const isAvailable = idx === 0 || completedParts.includes(prev.id);
                const isLocked    = !isDone && !isAvailable;

                const badgeClass  = p.track === 'teleios' ? 'part-track-badge--teleios' : 'part-track-badge--advocacy';
                const badgeLabel  = p.track === 'teleios' ? '📚 Teleios' : '🎯 Advocacy';

                let statusHtml;
                if (isDone)           statusHtml = `<div class="part-status part-status--done">✓</div>`;
                else if (isAvailable) statusHtml = `<div class="part-status part-status--available">${p.order}</div>`;
                else                  statusHtml = `<div class="part-status">🔒</div>`;

                const href = `/lesson.html?moduleId=${moduleId}&part=${p.id}`;
                return `
                    <a class="part-row${isDone ? ' part-row--done' : ''}${isLocked ? ' part-row--locked' : ''}"
                       href="${isLocked ? '#' : escHtml(href)}">
                        ${statusHtml}
                        <div class="part-info">
                            <div class="part-row-title">${escHtml(p.title)}</div>
                            <span class="part-track-badge ${badgeClass}">${badgeLabel}</span>
                        </div>
                        ${!isLocked ? '<span class="part-row-arrow">→</span>' : ''}
                    </a>`;
            }

            document.getElementById('lessonBody').innerHTML = `
                <div class="parts-index">
                    <p class="parts-index-intro">This week has two tracks. Complete each part in sequence — finish a part to unlock the next.</p>
                    <div class="parts-track-group">
                        <span class="parts-track-label">📚 Teleios Track — Personal Formation</span>
                        ${teleiosParts.map(p => partRow(p)).join('')}
                    </div>
                    <div class="parts-track-group">
                        <span class="parts-track-label">🎯 Advocacy Track — Deployment Training</span>
                        ${advocacyParts.map(p => partRow(p)).join('')}
                    </div>
                </div>`;
        }

        // ── SINGLE PART VIEW ────────────────────────────────────
        function renderPart(pid) {
            const parts   = currentMod.parts;
            const idx     = parts.findIndex(p => p.id === pid);
            if (idx === -1) { showError('Part not found.'); return; }

            const part    = parts[idx];
            const prev    = parts[idx - 1];
            const isAvail = idx === 0 || completedParts.includes(prev.id);

            // Guard: direct URL access to locked part
            if (!isAvail) {
                document.getElementById('lessonBackBtn').href = `/lesson.html?moduleId=${moduleId}`;
                document.getElementById('topbarTitle').textContent = 'Locked';
                document.getElementById('lessonTitle').textContent = '🔒 ' + escHtml(part.title);
                document.getElementById('lessonBody').innerHTML = `
                    <div style="text-align:center;padding:3rem 1.5rem">
                        <p style="font-size:1.5rem;margin-bottom:1rem">🔒</p>
                        <p style="color:var(--text-sec);font-size:14px">Complete &ldquo;${escHtml(prev.title)}&rdquo; first to unlock this part.</p>
                        <br>
                        <button class="btn-back-index" onclick="history.back()">← Back</button>
                    </div>`;
                return;
            }

            const isDone   = completedParts.includes(pid);
            const isLast   = idx === parts.length - 1;
            const nextPart = !isLast ? parts[idx + 1] : null;
            const track    = part.track === 'teleios' ? '📚 Teleios Track' : '🎯 Advocacy Track';

            // Hero
            document.getElementById('lessonBackBtn').href = `/lesson.html?moduleId=${moduleId}`;
            document.getElementById('topbarTitle').textContent = currentMod.title || 'Lesson';
            document.getElementById('lessonMeta').textContent  =
                'Week ' + (currentMod.week || 1) + ' · Part ' + part.order + ' of ' + parts.length;
            document.getElementById('lessonTitle').textContent    = part.title;
            document.getElementById('lessonSubtitle').textContent = track;

            // Breadcrumb
            const bc = document.getElementById('partBreadcrumb');
            bc.style.display = 'flex';
            bc.innerHTML = `
                <a class="part-breadcrumb-back" href="/lesson.html?moduleId=${moduleId}">← All parts</a>
                <span class="part-breadcrumb-label">Part ${part.order} / ${parts.length}</span>
                <span style="width:60px"></span>`;

            // Content
            const body = document.getElementById('lessonBody');
            body.innerHTML = renderMarkdown(part.content || '');

            // Completion footer
            const footer = document.createElement('div');
            footer.className = 'part-complete-section';

            if (isDone) {
                footer.innerHTML = `
                    <p class="completion-done-note">✅ Part complete</p>
                    ${nextPart
                        ? `<button class="btn-complete" onclick="nav('${nextPart.id}')">Next: ${escHtml(nextPart.title)} →</button>`
                        : `<button class="btn-complete" onclick="nav(null)">View Week Summary →</button>`
                    }
                    <button class="btn-back-index" onclick="nav(null)">← Back to all parts</button>`;
            } else {
                const btnLabel = isLast ? '✅ Complete Week 1' : 'Mark Complete &amp; Continue →';
                footer.innerHTML = `
                    <button class="btn-complete" id="markBtn" onclick="markComplete('${pid}')">${btnLabel}</button>
                    <button class="btn-back-index" onclick="nav(null)">← Back to all parts</button>`;
            }
            body.appendChild(footer);
        }

        // ── MARK COMPLETE ───────────────────────────────────────
        async function markComplete(pid) {
            const btn = document.getElementById('markBtn');
            if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

            const parts   = currentMod.parts;
            const idx     = parts.findIndex(p => p.id === pid);
            const isLast  = idx === parts.length - 1;
            const isFirst = completedParts.length === 0;

            const update = {
                [`progress.${moduleId}.completedParts`]: firebase.firestore.FieldValue.arrayUnion(pid),
                [`progress.${moduleId}.updatedAt`]:      firebase.firestore.FieldValue.serverTimestamp(),
            };
            if (isFirst)  update[`progress.${moduleId}.startedAt`]   = firebase.firestore.FieldValue.serverTimestamp();
            if (isLast)   update[`progress.${moduleId}.completedAt`] = firebase.firestore.FieldValue.serverTimestamp();

            try {
                await firebase.firestore().collection('users').doc(_lessonUser.uid).update(update);
                completedParts = [...completedParts, pid];
            } catch (e) {
                console.error('markComplete:', e);
                if (btn) { btn.disabled = false; btn.innerHTML = 'Mark Complete &amp; Continue →'; }
                return;
            }

            if (isLast) {
                showWeekComplete();
            } else {
                window.location.href = `/lesson.html?moduleId=${moduleId}&part=${parts[idx + 1].id}`;
            }
        }

        function nav(pid) {
            window.location.href = pid
                ? `/lesson.html?moduleId=${moduleId}&part=${pid}`
                : `/lesson.html?moduleId=${moduleId}`;
        }

        // ── WEEK COMPLETE ───────────────────────────────────────
        function showWeekComplete() {
            document.getElementById('partBreadcrumb').style.display = 'none';
            document.getElementById('lessonMeta').textContent     = 'Week 1 of 6 · Complete';
            document.getElementById('lessonTitle').textContent    = 'Week 1 Complete!';
            document.getElementById('lessonSubtitle').textContent = 'Both tracks finished. Your formation continues in Week 2.';

            const isFree = TIER_ORDER[userTier] < TIER_ORDER['foundation'];

            const week2Block = isFree ? `
                <div class="next-week-locked">
                    <div class="next-week-locked-header">
                        <div class="next-week-locked-eyebrow">🔒 Week 2 · Foundation Required</div>
                        <div class="next-week-locked-title">The Ephesians 4 Framework</div>
                        <div class="next-week-locked-sub">Move from abstract wholeness to the 4 specific covenant capacities Ephesians 4 demands.</div>
                    </div>
                    <div class="next-week-parts-preview">
                        <div class="next-week-part-item"><div class="next-week-part-dot">🔒</div>Teleios Track · 4 parts</div>
                        <div class="next-week-part-item"><div class="next-week-part-dot">🔒</div>Advocacy Track · 4 parts</div>
                        <div class="next-week-part-item"><div class="next-week-part-dot">🔒</div>Weeks 3–6 included at Foundation</div>
                    </div>
                    <div class="next-week-cta-row">
                        <a href="/payment?tier=foundation" class="btn-upgrade">Unlock Foundation — Continue Week 2 →</a>
                        <p class="next-week-price-note">Foundation tier · <strong>$9/month</strong> · Cancel anytime</p>
                    </div>
                </div>
                <a href="/board.html?id=board-formation-talk" class="week-complete-discuss-link">💬 Share your Week 1 breakthrough in Formation Talk →</a>` : `
                <div class="week-complete-links">
                    <a href="/lesson.html?moduleId=teleios-week-2" class="btn-upgrade">Start Week 2 →</a>
                </div>
                <a href="/board.html?id=board-teleios-weekly" class="week-complete-discuss-link">💬 Post your Week 1 reflection in Teleios Formation Circle →</a>`;

            document.getElementById('lessonBody').innerHTML = `
                <div class="week-complete-block">
                    <div class="week-complete-icon">🏆</div>
                    <h2>Week 1 Complete!</h2>
                    <p>You've finished both the Teleios and Advocacy tracks for Week 1. ${isFree ? 'Unlock Foundation to continue your formation through all 6 weeks.' : 'Your formation path continues.'}</p>
                    ${week2Block}
                    <a href="/learn.html" style="display:block;font-size:13px;color:var(--text-sec);text-decoration:none;margin-top:20px;text-align:center">← Back to Formation Hub</a>
                </div>`;
        }

        // ── LEGACY (modules without parts array) ─────────────────
        function renderLegacyContent() {
            const mod          = currentMod;
            const requiredTier = mod.requiredTier || mod.accessLevel || 'free';
            document.getElementById('lessonBackBtn').href         = '/learn.html';
            document.getElementById('topbarTitle').textContent    = mod.title || 'Lesson';
            document.getElementById('lessonMeta').textContent     = 'Week ' + (mod.week || '') + ' · ' + capitalize(requiredTier);
            document.getElementById('lessonTitle').textContent    = mod.title || 'Lesson';
            document.getElementById('lessonSubtitle').textContent = '';
            document.getElementById('lessonBody').innerHTML       = renderMarkdown(mod.content || '_Content coming soon._');
        }

        // ── UPGRADE WALL ────────────────────────────────────────
        function showUpgradeWall(tier, title) {
            document.getElementById('lessonBody').innerHTML = '';
            document.getElementById('upgradeWall').style.display = 'block';
            document.getElementById('upgradeWall').querySelector('p').textContent =
                `This content requires ${capitalize(tier)} tier. Unlock it to access this week and all future weeks.`;
            document.getElementById('upgradeWall').querySelector('a').href = '/payment?tier=' + tier;
            document.getElementById('topbarTitle').textContent = 'Locked';
            document.getElementById('lessonTitle').textContent = '🔒 ' + (title || 'Locked');
        }

        function showError(msg) {
            document.getElementById('lessonBody').innerHTML =
                `<p style="color:var(--text-sec);padding:1.5rem;text-align:center">${escHtml(msg)}</p>`;
        }

        // ── MARKDOWN RENDERER ───────────────────────────────────
        function renderMarkdown(md) {
            return md
                .replace(/^---$/gm, '<hr>')
                .replace(/^> (.+)$/gm, (_, t) => `<blockquote>${inlineFormat(t)}</blockquote>`)
                .replace(/^## (.+)$/gm, (_, t) => `<h2>${t}</h2>`)
                .replace(/^### (.+)$/gm, (_, t) => `<h3>${t}</h3>`)
                .replace(/^# (.+)$/gm,  (_, t) => `<h2>${t}</h2>`)
                .replace(/^- (.+)$/gm,  (_, t) => `<li>${inlineFormat(t)}</li>`)
                .replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
                .replace(/^(?!<[a-z])(.+)$/gm, (_, t) => t.trim() ? `<p>${inlineFormat(t)}</p>` : '')
                .replace(/\n{3,}/g, '\n\n');
        }
        function inlineFormat(t) {
            return t
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g,     '<em>$1</em>')
                .replace(/`(.+?)`/g,       '<code>$1</code>');
        }
        function escHtml(s) {
            if (!s) return '';
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
    </script>
