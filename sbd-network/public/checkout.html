<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="build-version" content="1778614074359">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Checkout - SBD Network">
    <meta name="theme-color" content="#000000">
    <title>Checkout - SBD Network</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    
    <!-- Stripe.js no longer needed — using Stripe Hosted Checkout via Cloud Function -->
    
    <style>
        .checkout-page {
            min-height: 100vh;
            background: var(--bg-primary, #000);
            padding: 20px;
            padding-bottom: 40px;
        }
        
        .checkout-container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .checkout-header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid var(--border-color, #333);
            margin-bottom: 30px;
        }
        
        .checkout-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--text-primary, #fff);
        }
        
        .checkout-header p {
            color: var(--text-secondary, #aaa);
            margin: 0;
        }
        
        .order-summary {
            background: var(--bg-secondary, #1a1a1a);
            border: 1px solid var(--border-color, #333);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
        }
        
        .order-summary h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 0 0 20px 0;
            color: var(--text-primary, #fff);
        }
        
        .product-info {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .product-icon {
            font-size: 3rem;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary, #2a2a2a);
            border-radius: 12px;
        }
        
        .product-details {
            flex: 1;
        }
        
        .product-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0 0 4px 0;
            color: var(--text-primary, #fff);
        }
        
        .product-description {
            font-size: 0.9rem;
            color: var(--text-secondary, #aaa);
            margin: 0;
        }
        
        .order-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid var(--border-color, #333);
        }
        
        .order-total-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary, #fff);
        }
        
        .order-total-amount {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-primary, #00bcd4);
        }
        
        .payment-form {
            background: var(--bg-secondary, #1a1a1a);
            border: 1px solid var(--border-color, #333);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
        }
        
        .payment-form h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 0 0 20px 0;
            color: var(--text-primary, #fff);
        }
        
        .form-row {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary, #fff);
        }
        
        .form-input {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            background: var(--bg-tertiary, #2a2a2a);
            border: 1px solid var(--border-color, #333);
            border-radius: 8px;
            color: var(--text-primary, #fff);
            transition: border-color 0.3s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary, #00bcd4);
        }
        
        /* Stripe Elements styling */
        .StripeElement {
            padding: 14px;
            background: var(--bg-tertiary, #2a2a2a);
            border: 1px solid var(--border-color, #333);
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        
        .StripeElement--focus {
            border-color: var(--accent-primary, #00bcd4);
        }
        
        .StripeElement--invalid {
            border-color: #ff4444;
        }
        
        #card-errors {
            color: #ff4444;
            font-size: 0.85rem;
            margin-top: 8px;
            min-height: 20px;
        }
        
        .pay-button {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            background: var(--accent-primary, #00bcd4);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .pay-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 188, 212, 0.4);
        }
        
        .pay-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .cancel-button {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            background: transparent;
            color: var(--text-secondary, #aaa);
            border: 1px solid var(--border-color, #333);
            border-radius: 8px;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.3s;
        }
        
        .cancel-button:hover {
            border-color: var(--text-primary, #fff);
            color: var(--text-primary, #fff);
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spinner 0.6s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spinner {
            to { transform: rotate(360deg); }
        }
        
        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .secure-badge-icon {
            font-size: 1.2rem;
        }
        
        .secure-badge-text {
            font-size: 0.85rem;
            color: #4caf50;
        }
    </style>
</head>
<body class="checkout-page">
    
    <div class="checkout-container">
        
        <!-- Header -->
        <div class="checkout-header">
            <h1>Secure Checkout</h1>
            <p>Complete your purchase</p>
        </div>
        
        <!-- Order Summary -->
        <div class="order-summary">
            <h2>Order Summary</h2>
            
            <div class="product-info">
                <div class="product-icon" id="product-icon">📦</div>
                <div class="product-details">
                    <div class="product-name" id="product-name">Loading...</div>
                    <div class="product-description" id="product-description">Please wait...</div>
                </div>
            </div>
            
            <div class="order-total">
                <span class="order-total-label">Total</span>
                <span class="order-total-amount" id="order-total">$0</span>
            </div>
        </div>
        
        <!-- Payment Action -->
        <div class="payment-form">
            <h2>Payment</h2>
            <p style="color:var(--text-secondary,#aaa);font-size:0.9rem;margin:0 0 20px 0;line-height:1.6">
                You'll be taken to Stripe's secure checkout page to enter your card details.
                Your payment is processed by Stripe — we never see your card number.
            </p>

            <div id="checkout-error" style="color:#ff4444;font-size:0.85rem;margin-bottom:16px;min-height:20px"></div>

            <button id="pay-button" class="pay-button" onclick="startStripeCheckout(currentProductId)">
                💳 Pay with Card
            </button>

            <button type="button" class="cancel-button" onclick="window.location.href='/shop.html'">
                Cancel
            </button>

            <div class="secure-badge">
                <span class="secure-badge-icon">🔒</span>
                <span class="secure-badge-text">Secure checkout powered by Stripe</span>
            </div>
        </div>
        
    </div>
    
    <!-- Firebase SDKs -->
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
    <script defer src="/js/firebase.js"></script>
    
    <!-- Checkout Script -->
    <script src="/js/checkout.js" defer></script>
    
</body>
</html>
