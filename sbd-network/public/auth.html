<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="build-version" content="1790009922239">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="SBD Network - Private Learning Community">
    <meta name="theme-color" content="#000000">
    <title>SBD Network - Login</title>
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
    
    <!-- CSS -->
    <link rel="stylesheet" href="/css/styles.css?v=1790009922239">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
</head>
<body class="auth-page">
    
    <!-- Login Container -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-logo">SBD Network</h1>
                <p class="auth-tagline">Private Learning Community</p>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <h2>Sign In</h2>
                
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required placeholder="your@email.com">
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                
                <div class="form-group remember-row">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Sign In
                </button>
                
                <p class="form-footer">
                    Don't have an account? 
                    <a href="#" id="showSignup">Sign Up</a>
                </p>
                <p class="form-footer" style="margin-top:8px;">
                    <a href="#" id="forgotPasswordLink" style="font-size:0.85rem;color:var(--accent-primary,#00bcd4);">Forgot password?</a>
                </p>
            </form>
            
            <!-- Signup Form (Hidden by default) -->
            <form id="signupForm" class="auth-form" style="display: none;">
                <h2>Create Account</h2>
                
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" required placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" required placeholder="your@email.com">
                </div>
                
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" required placeholder="••••••••" minlength="6">
                    <small>At least 6 characters</small>
                </div>
                
                <div class="form-group">
                    <label for="signupPasswordConfirm">Confirm Password</label>
                    <input type="password" id="signupPasswordConfirm" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    Create Account
                </button>
                
                <p class="form-footer">
                    Already have an account? 
                    <a href="#" id="showLogin">Sign In</a>
                </p>
            </form>
            
            <!-- Error/Success Messages -->
            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>
    
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>
    
    <!-- Firebase SDKs -->
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- App Scripts -->
    <script defer src="/js/firebase.js?v=1790009922239"></script>
    <script defer src="/js/sw-update-checker.js?v=1790009922239"></script>
    <script defer src="/js/auth.js?v=1790009922239authfix1"></script>
</body>
</html>
