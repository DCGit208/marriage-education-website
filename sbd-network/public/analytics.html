<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Analytics - SBD Network</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/analytics.css">
  <link rel="stylesheet" href="/css/bottom-nav.css?v=40">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
</head>
<body class="analytics-page bottom-nav-page">

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <button id="backBtn" class="btn btn-icon" aria-label="Back">←</button>
      <span class="page-title">Analytics</span>
    </div>
    <div class="header-right">
      <button id="refreshBtn" class="btn btn-icon" aria-label="Refresh">🔄</button>
    </div>
  </header>

  <main class="analytics-main">

    <!-- Overview Stats -->
    <section class="analytics-section">
      <h2 class="section-title">Your Activity</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">📝</div>
          <div class="stat-value" id="totalPosts">-</div>
          <div class="stat-label">Posts Created</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">❤️</div>
          <div class="stat-value" id="totalReactions">-</div>
          <div class="stat-label">Reactions Received</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">💬</div>
          <div class="stat-value" id="totalComments">-</div>
          <div class="stat-label">Comments Made</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🔥</div>
          <div class="stat-value" id="engagementRate">-</div>
          <div class="stat-label">Engagement Rate</div>
        </div>
      </div>
    </section>

    <!-- Time Period Filter -->
    <section class="analytics-section">
      <div class="period-filter">
        <button class="period-btn active" data-period="7">Last 7 Days</button>
        <button class="period-btn" data-period="30">Last 30 Days</button>
        <button class="period-btn" data-period="all">All Time</button>
      </div>
    </section>

    <!-- Activity Chart -->
    <section class="analytics-section">
      <h2 class="section-title">Activity Over Time</h2>
      <div class="chart-container">
        <canvas id="activityChart"></canvas>
      </div>
    </section>

    <!-- Top Posts -->
    <section class="analytics-section">
      <h2 class="section-title">Your Top Posts</h2>
      <p class="section-hint">Posts with the most reactions in the selected period</p>
      <div id="topPostsList" class="top-posts-list">
        <div class="loading-text">Loading...</div>
      </div>
    </section>

    <!-- Board Stats (for admins) -->
    <section class="analytics-section" id="boardStatsSection" style="display:none;">
      <h2 class="section-title">Board Management Stats</h2>
      <div id="boardStatsList" class="board-stats-list">
        <div class="loading-text">Loading...</div>
      </div>
    </section>

  </main>

  <!-- Loading -->
  <div id="loadingOverlay" class="loading-overlay"><div class="spinner"></div></div>

  <!-- Firebase SDKs -->
  <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts -->
  <script defer src="/js/firebase.js?v=40"></script>
  <script defer src="/js/formation-access.js?v=104"></script>
  <script defer src="/js/sw-update-checker.js?v=96"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script defer src="/js/analytics.js?v=103"></script>
  <script defer src="/js/transitions.js?v=40"></script>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="/dashboard.html" class="bn-tab" aria-label="Home">
      <span class="bn-icon">🏠</span>
      <span class="bn-label">Home</span>
    </a>
    <a href="/schools.html" class="bn-tab" aria-label="Learn">
      <span class="bn-icon">📚</span>
      <span class="bn-label">Learn</span>
    </a>
    <a href="/boards.html" class="bn-tab" aria-label="Boards">
      <span class="bn-icon">📋</span>
      <span class="bn-label">Boards</span>
    </a>
    <a href="/mv-house.html" class="bn-tab" aria-label="MV House">
      <span class="bn-icon">👗</span>
      <span class="bn-label">MV House</span>
    </a>
    <a href="/shop.html" class="bn-tab" aria-label="Shop">
      <span class="bn-icon">🛒</span>
      <span class="bn-label">Shop</span>
    </a>
    <a href="/profile.html" class="bn-tab" aria-label="Profile">
      <span class="bn-icon">👤</span>
      <span class="bn-label">Profile</span>
    </a>
  </nav>

</body>
</html>
