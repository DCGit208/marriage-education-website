<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate SBD Network Icons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        canvas {
            border: 2px solid #00bcd4;
            margin: 20px;
        }
        button {
            background: #00bcd4;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #00acc1;
        }
        .instructions {
            max-width: 600px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="instructions">
        <h1>SBD Network Icon Generator</h1>
        <p>Click the buttons below to generate and download placeholder icons for your PWA.</p>
        <p>These are temporary icons - replace them with your actual logo later.</p>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div>
        <button onclick="generateIcon(72)">Download 72x72</button>
        <button onclick="generateIcon(96)">Download 96x96</button>
        <button onclick="generateIcon(128)">Download 128x128</button>
        <button onclick="generateIcon(144)">Download 144x144</button>
    </div>
    <div>
        <button onclick="generateIcon(152)">Download 152x152</button>
        <button onclick="generateIcon(192)">Download 192x192</button>
        <button onclick="generateIcon(384)">Download 384x384</button>
        <button onclick="generateIcon(512)">Download 512x512</button>
    </div>
    
    <script>
        function generateIcon(size) {
            const canvas = document.getElementById('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#00bcd4';
            ctx.fillRect(0, 0, size, size);
            
            // Text
            ctx.fillStyle = '#000000';
            ctx.font = `bold ${size * 0.45}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('SBD', size / 2, size / 2);
            
            // Download
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `icon-${size}.png`;
                a.click();
                URL.revokeObjectURL(url);
            });
        }
    </script>
</body>
</html>
