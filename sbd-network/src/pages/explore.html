<!DOCTYPE html>
<!-- TEMPLATE: Edit this file in src/pages/explore.html — run: node build.js -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Explore - SBD Network</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/bottom-nav.css?v=1789610000001">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
</head>
<body data-page="" class="bottom-nav-page has-header">

  <header class="app-header">
    <div class="header-left" style="flex:1;padding-right:8px;">
      <div class="explore-search-wrap">
        <span class="explore-search-icon">🔍</span>
        <input type="search" id="exploreSearch" class="explore-search-input"
               placeholder="Search posts &amp; members…"
               autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
    </div>
  </header>

  <main class="explore-main">

    <!-- Hot this week -->
    <section id="hotSection">
      <h2 class="explore-section-title">🔥 Hot This Week</h2>
      <div id="hotGrid" class="explore-grid"></div>
    </section>

    <!-- People results (search) -->
    <section id="peopleSection" style="display:none;">
      <h2 class="explore-section-title">👤 Members</h2>
      <div id="peopleList"></div>
    </section>

    <!-- Post results (search) -->
    <section id="postsSection" style="display:none;">
      <h2 class="explore-section-title">📄 Posts</h2>
      <div id="searchPostsGrid" class="explore-grid"></div>
    </section>

  </main>

  <div id="loadingOverlay" class="loading-overlay"><div class="spinner"></div></div>

  <!-- Notification Panel -->
  <div id="notifOverlay" class="notif-overlay" style="display:none;"></div>
  <div id="notifPanel" class="notif-panel">
    <div class="notif-panel-header">
      <h3>Notifications</h3>
      <button id="notifPanelClose" class="btn btn-icon" aria-label="Close">✕</button>
    </div>
    <ul id="notifList" class="notif-list"></ul>
  </div>

  <!-- Firebase SDKs -->
  <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>

  <!-- App Scripts -->
  <script defer src="/js/firebase.js?v=75"></script>
  <script defer src="/js/formation-access.js?v=104"></script>
  <script defer src="/js/sw-update-checker.js?v=98"></script>
  <script defer src="/js/notifications.js?v=52"></script>
  <script defer src="/js/dm-badge.js?v=52"></script>
  <script defer src="/js/transitions.js?v=52"></script>
  <script defer src="/js/explore.js?v=52"></script>


    <!-- NAV_INJECT -->
</body>
</html>
