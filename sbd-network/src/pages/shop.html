<!DOCTYPE html>
<!-- TEMPLATE: Edit this file in src/pages/shop.html — run: node build.js -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Shop - SBD Network">
    <meta name="theme-color" content="#000000">
    <title>Shop - SBD Network</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/bottom-nav.css?v=1789610000001">
    <link rel="stylesheet" href="/css/shop.css">
    <link rel="stylesheet" href="/css/ask-sbd-guide.css?v=10">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
</head>
<body data-page="shop" class="shop-page bottom-nav-page has-header">
    
    <header class="app-header">
        <div class="header-left">
            <button class="back-btn btn btn-icon" aria-label="Back">←</button>
            <h1 class="page-title">Shop</h1>
        </div>
        <div class="header-right">
            <button class="notif-bell-btn btn btn-icon" aria-label="Notifications">
                🔔<span class="notif-badge" style="display:none;"></span>
            </button>
        </div>
    </header>
    
    <section id="shopHero" class="shop-hero">
        <div id="shopHeroMount" class="shop-hero__inner"></div>
    </section>
    
    <main class="shop-main">
        <div class="shop-toolbar">
            <div id="shopSectionBar" class="shop-section-bar" aria-label="Shop sections"></div>
            <input type="search" id="shopSearchInput" class="shop-search" placeholder="Search books, courses, membership…" autocomplete="off">
        </div>
        <p class="shop-meta"><span id="shopProductCount">Loading…</span></p>
        <div id="shopCategoryBar" class="shop-cat-bar" aria-label="Product categories"></div>

        <div id="shopBundleBanner" class="shop-bundle-banner" hidden></div>

        <section class="shop-section-block" data-ask-sbd-section="shop-resources">
            <p id="shopSectionIntro" class="shop-section-heading" hidden></p>
            <div id="shopMembershipGrid" class="shop-membership-grid" hidden></div>
            <div id="shopProgramRail" class="shop-program-rail" hidden></div>
            <div id="shopProductGrid" class="product-grid">
                <p class="shop-empty">Loading catalog…</p>
            </div>
        </section>
    </main>
    
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
    
    <script defer src="/js/firebase.js?v=75"></script>
    <script defer src="/js/formation-access.js?v=104"></script>
    <script defer src="/js/sw-update-checker.js?v=98"></script>
    <script defer src="/js/notifications.js?v=53"></script>
    <script defer src="/js/transitions.js?v=52"></script>
    <script defer src="/js/shop-product-ids.js"></script>
    <script defer src="/js/shop.js?v=210"></script>
    <script defer src="/js/ask-sbd-guide.js?v=10"></script>

    <!-- NAV_INJECT -->
</body>
</html>
