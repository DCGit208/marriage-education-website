<!DOCTYPE html>
<!-- TEMPLATE: Edit this file in src/pages/shop.html — run: node build.js -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Shop - SBD Network">
    <meta name="theme-color" content="#000000">
    <title>Shop - SBD Network</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/bottom-nav.css?v=41">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    
    <style>
        .shop-page {
            padding-bottom: 80px;
        }
        
        .shop-hero {
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--accent-primary, #00bcd4) 0%, #0097a7 100%);
            text-align: center;
            color: #fff;
        }
        
        .shop-hero h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 12px 0;
        }
        
        .shop-hero p {
            font-size: 1rem;
            margin: 0;
            opacity: 0.95;
        }
        
        .shop-section {
            padding: 30px 20px;
            border-bottom: 1px solid var(--border-color, #333);
        }
        
        .shop-section:last-child {
            border-bottom: none;
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 20px 0;
            color: var(--text-primary, #fff);
        }
        
        .product-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        
        @media (min-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        .product-card {
            background: var(--bg-secondary, #1a1a1a);
            border: 1px solid var(--border-color, #333);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 188, 212, 0.2);
            border-color: var(--accent-primary, #00bcd4);
        }
        
        .product-image {
            width: 100%;
            height: 200px;
            background: var(--bg-tertiary, #2a2a2a);
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        
        .product-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: var(--text-primary, #fff);
        }
        
        .product-description {
            font-size: 0.9rem;
            color: var(--text-secondary, #aaa);
            line-height: 1.6;
            margin: 0 0 16px 0;
        }
        
        .product-price {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-primary, #00bcd4);
            margin: 0 0 16px 0;
        }
        
        .product-btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
        }
        
        .bundle-badge {
            display: inline-block;
            background: var(--accent-primary, #00bcd4);
            color: #fff;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        
        .savings-text {
            font-size: 0.85rem;
            color: #4caf50;
            margin: 0 0 12px 0;
        }
        
        .subscription-note {
            padding: 20px;
            background: var(--bg-secondary, #1a1a1a);
            border: 1px solid var(--border-color, #333);
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .subscription-note h3 {
            font-size: 1.1rem;
            margin: 0 0 8px 0;
            color: var(--text-primary, #fff);
        }
        
        .subscription-note p {
            font-size: 0.9rem;
            color: var(--text-secondary, #aaa);
            margin: 0 0 16px 0;
        }
        
        .subscription-note .btn {
            padding: 12px 32px;
        }

        .shop-toolbar {
            padding: 16px 20px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .shop-search {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color, #333);
            background: var(--bg-secondary, #1a1a1a);
            color: var(--text-primary, #fff);
            font-size: 0.95rem;
        }

        .shop-meta {
            font-size: 0.85rem;
            color: var(--text-secondary, #aaa);
            padding: 0 20px 8px;
        }

        .shop-cat-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 20px 12px;
            -webkit-overflow-scrolling: touch;
        }

        .shop-cat-btn {
            flex: 0 0 auto;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-color, #333);
            background: var(--bg-secondary, #1a1a1a);
            color: var(--text-secondary, #aaa);
            font-size: 0.8rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .shop-cat-btn.active {
            background: var(--accent-primary, #00bcd4);
            border-color: var(--accent-primary, #00bcd4);
            color: #000;
            font-weight: 600;
        }

        .shop-phase-banner {
            background: rgba(0, 188, 212, 0.1);
            border: 1px solid rgba(0, 188, 212, 0.35);
            border-radius: 12px;
            padding: 12px 16px;
            margin: 0 20px 16px;
            color: var(--text-secondary, #ccc);
            font-size: 0.95rem;
            line-height: 1.45;
        }

        .product-card--soon {
            opacity: 0.85;
        }

        .soon-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-secondary, #aaa);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .shop-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-secondary, #aaa);
            padding: 40px 20px;
        }
    </style>
</head>
<body data-page="shop" class="shop-page bottom-nav-page has-header">
    
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <button class="back-btn btn btn-icon" aria-label="Back">←</button>
            <h1 class="page-title">Shop</h1>
        </div>
        <div class="header-right">
            <button class="notif-bell-btn btn btn-icon" aria-label="Notifications">
                🔔<span class="notif-badge" style="display:none;"></span>
            </button>
        </div>
    </header>
    
    <!-- Hero Section -->
    <section class="shop-hero">
        <h1>Own Your Formation</h1>
        <p>Learn through subscription. Own through purchase.</p>
    </section>
    
    <!-- Main Content -->
    <main class="shop-main">
        
        <section class="shop-section" style="padding-bottom:0">
            <div class="subscription-note">
                <h3>Books · Courses · Diplomas · Membership</h3>
                <p id="shopCatalogNote">Loading catalog…</p>
            </div>
            <p id="shopPhaseBanner" class="shop-phase-banner" role="status">Loading rollout phase…</p>
        </section>

        <div class="shop-toolbar">
            <input type="search" id="shopSearchInput" class="shop-search" placeholder="Search products…" autocomplete="off">
        </div>
        <p class="shop-meta"><span id="shopProductCount">Loading…</span></p>
        <div id="shopCategoryBar" class="shop-cat-bar" aria-label="Product categories"></div>

        <section class="shop-section">
            <div id="shopProductGrid" class="product-grid">
                <p class="shop-empty">Loading catalog…</p>
            </div>
        </section>
        
    </main>
    
    <!-- Firebase SDKs -->
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
    
    <!-- App Scripts -->
    <script defer src="/js/firebase.js?v=75"></script>
    <script defer src="/js/formation-access.js?v=104"></script>
    <script defer src="/js/sw-update-checker.js?v=98"></script>
    <script defer src="/js/notifications.js?v=52"></script>
    <script defer src="/js/transitions.js?v=52"></script>
    <script defer src="/js/shop.js?v=201"></script>
    

    <!-- NAV_INJECT -->
</body>
</html>
